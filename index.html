
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olivia's Book Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <style>
    body {
      font-family: -apple-system, Arial, sans-serif;
      background: #f5f6fa;
      color: #202538;
      margin: 0;
      padding: 24px 16px;
    }
    main {
      max-width: 500px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 18px;
      margin-top: 20px;
    }
    button {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    #reader { width: 100%; margin-top: 16px; }
    #result { margin-top: 20px; overflow-wrap: anywhere; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      margin: 12px 0;
    }
  </style>
</head>
<body>
<main>
  <h1>📚 Olivia's Book Scanner</h1>
  <p>Scan a book's ISBN barcode with your iPhone.</p>

  <div class="card">
    <h2>📷 Scan a Book</h2>
    <button id="scanButton" onclick="startScanner()">
      Start Camera
    </button>
    <div id="reader"></div>
    <p>Or take a photo of the barcode:</p>

<input
  type="file"
  id="barcodePhoto"
  accept="image/*"
  onchange="scanBarcodePhoto(event)"
>

    <p>Or enter the ISBN manually:</p>
    <input id="isbn" placeholder="9781338530124"
           inputmode="numeric">
    <button onclick="findBook()">Find Book</button>

    <div id="result" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
  const AR_API_URL = "https://script.google.com/macros/s/AKfycby5xq8awAkmTB2qB3WUhHGGuc59lcxVweA59wZiP29pFMSL3NG3v-TQQ_QA7T4skIAL_Q/exec";
  let scanner = null;
  let busy = false;

  
let liveReader = null;
let liveControls = null;

async function startScanner() {
  const result = document.getElementById("result");
  const reader = document.getElementById("reader");

  try {
    if (!window.ZXingBrowser) {
      throw new Error("ZXing library did not load.");
    }

    if (liveControls) return;

    result.textContent = "Opening camera...";
    reader.innerHTML = "";

    const video = document.createElement("video");
    video.setAttribute("playsinline", "true");
    video.setAttribute("autoplay", "true");
    video.style.width = "100%";
    reader.appendChild(video);

    liveReader = new ZXingBrowser.BrowserMultiFormatReader();

    liveControls = await liveReader.decodeFromConstraints(
      {
        audio: false,
        video: {
  facingMode: { ideal: "environment" },
  width: { ideal: 1920 },
  height: { ideal: 1080 }
}
      },
      video,
      async (scanResult, error, controls) => {
        if (!scanResult || busy) return;

        const isbn = scanResult.getText();
        result.textContent = "Barcode detected: " + isbn;

        if (!/^97[89]\d{10}$/.test(isbn)) return;

        busy = true;
        controls.stop();
        liveControls = null;

        document.getElementById("isbn").value = isbn;
        result.textContent = "ISBN detected: " + isbn;

        await findBook();
        busy = false;
      }
    );

    result.textContent = "Point camera at the ISBN barcode.";

  } catch (error) {
    result.textContent = "Camera error: " + error.message;
    await stopScanner();
  }
}


  
async function stopScanner() {
  if (liveControls) {
    liveControls.stop();
    liveControls = null;
  }

  liveReader = null;

  const reader = document.getElementById("reader");
  if (reader) reader.innerHTML = "";
}

  async function findBook() {
    const isbn = document.getElementById("isbn")
      .value.replace(/[^0-9]/g, "");
    const result = document.getElementById("result");

    if (!/^97[89]\d{10}$/.test(isbn)) {
      result.textContent = "Please enter a valid 13-digit ISBN.";
      return;
    }

    result.textContent = "Looking up book...";

    try {
      const url = "https://openlibrary.org/api/books?bibkeys=ISBN:" +
        encodeURIComponent(isbn) +
        "&format=json&jscmd=data";

      const response = await fetch(url);
      if (!response.ok) throw new Error("Book service unavailable");

      const data = await response.json();
      const book = data["ISBN:" + isbn];

      if (!book) {
        result.textContent = "Book not found in Open Library.";
        return;
      }

      result.textContent = "";

      const heading = document.createElement("h3");
      heading.textContent = book.title || "Unknown title";
      result.appendChild(heading);

      const authors = (book.authors || [])
        .map(a => a.name).join(", ");

      const details = document.createElement("p");
      details.textContent = "Author: " + authors +
        " | ISBN: " + isbn +
        " | Pages: " + (book.number_of_pages || "Unknown");
      result.appendChild(details);
      
const arLink = document.createElement("a");

arLink.href = "https://www.arbookfind.com/";
arLink.target = "_blank";
arLink.rel = "noopener noreferrer";
arLink.textContent = "🔎 Find AR Book Level on AR BookFinder";

arLink.style.display = "inline-block";
arLink.style.marginTop = "12px";
arLink.style.marginBottom = "12px";
arLink.style.color = "#2563eb";
arLink.style.fontWeight = "bold";

result.appendChild(arLink);


     // Check Olivia's AR quiz history
const arStatus = document.createElement("p");
arStatus.textContent = "Checking Olivia's AR quiz history...";
result.appendChild(arStatus);

try {
  const arUrl = AR_API_URL +
    "?title=" + encodeURIComponent(book.title);

  const arResponse = await fetch(arUrl);

  if (!arResponse.ok) {
    throw new Error("AR history service unavailable");
  }

  const arData = await arResponse.json();

  if (Array.isArray(arData.quizzes) && arData.quizzes.length > 0) {
    const quiz = arData.quizzes?.[0];

arStatus.textContent =
  "✅ Olivia has already taken this AR quiz!" +
  (quiz?.score != null
    ? "\nScore: " + quiz.score + "%"
    : "") +
  (quiz?.arLevel != null
    ? "\n📚 AR Book Level: " + quiz.arLevel.toFixed(1)
    : "");

arStatus.style.whiteSpace = "pre-line";
  } else {
    
  // Look up AR level for books without completed quizzes
  try {
    const levelUrl = AR_API_URL +
      "?isbn=" + encodeURIComponent(isbn);

    const levelResponse = await fetch(levelUrl);

    if (!levelResponse.ok) {
      throw new Error("AR level lookup failed");
    }

    const levelData = await levelResponse.json();

    
if (levelData.found && levelData.arLevel != null) {
  arStatus.textContent =
    "📚 AR Book Level: " + levelData.arLevel +
    "\n🔢 AR Quiz Number: " + (levelData.arQuizNumber || "N/A") +
    "\n⭐ AR Points: " + (levelData.arPoints ?? "N/A") +
    "\n📖 No completed AR quiz found in Olivia's history.";

    } else {
      arStatus.textContent =
        "📖 No completed AR quiz found in Olivia's history." +
        "\n🔎 AR level not in database.";
    }

    arStatus.style.whiteSpace = "pre-line";

  } catch (error) {
    arStatus.textContent =
      "📖 No completed AR quiz found in Olivia's history." +
      "\n⚠️ Unable to retrieve AR level.";
    console.error(error);
  }


  }

} catch (error) {
  arStatus.textContent =
    "⚠️ Unable to check AR quiz history.";
  console.error(error);
}
    } catch (error) {
      result.textContent = "Lookup error: " +
        (error?.message || String(error));
    }
  }

async function scanBarcodePhoto(event) {
  const result = document.getElementById("result");
  const file = event.target.files[0];
  if (!file) return;

  result.textContent = "Analyzing barcode photo...";

  let scanner = null;
  let imageUrl = null;

  try {
    if (typeof Html5Qrcode === "undefined") {
      throw new Error("Barcode scanner library did not load.");
    }

    const image = await createImageBitmap(file);
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    scanner = new Html5Qrcode("reader");

    // Try the full image and several overlapping regions.
    const regions = [
      [0, 0, 1, 1],
      [0, 0.35, 1, 0.65],
      [0, 0.5, 1, 0.5],
      [0.1, 0.2, 0.8, 0.7],
      [0.15, 0.4, 0.7, 0.5],
      [0, 0, 0.7, 1],
      [0.3, 0, 0.7, 1]
    ];

    let isbn = null;

    for (let i = 0; i < regions.length; i++) {
      result.textContent =
        "Scanning photo... attempt " +
        (i + 1) + " of " + regions.length;

      const [x, y, w, h] = regions[i];

      const sx = Math.floor(x * image.width);
      const sy = Math.floor(y * image.height);
      const sw = Math.floor(w * image.width);
      const sh = Math.floor(h * image.height);

      const scale = Math.min(2, 1800 / sw);
      canvas.width = Math.round(sw * scale);
      canvas.height = Math.round(sh * scale);

      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(
        image, sx, sy, sw, sh,
        0, 0, canvas.width, canvas.height
      );

      const blob = await new Promise(resolve =>
        canvas.toBlob(resolve, "image/png")
      );

      if (!blob) continue;

      const croppedFile = new File(
        [blob], "barcode.png", { type: "image/png" }
      );

      try {
        const code = await scanner.scanFile(croppedFile, false);
        if (/^97[89]\d{10}$/.test(code)) {
          isbn = code;
          break;
        }
      } catch (e) {
        // Try the next image region.
      }
    }

    image.close();

    if (!isbn) {
      throw new Error(
        "Barcode not detected. Try a closer, sharper photo."
      );
    }

    document.getElementById("isbn").value = isbn;
    result.textContent = "ISBN detected: " + isbn;

    await findBook();

  } catch (error) {
    result.textContent =
      "Could not read barcode: " + error.message;
  } finally {
    if (scanner) {
      try { scanner.clear(); } catch (e) {}
    }
    event.target.value = "";
  }
}

</script>
</body>
</html>
